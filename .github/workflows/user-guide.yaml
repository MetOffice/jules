# Build and deploy Sphinx-based user guide documentation to GitHub Pages

name: User Guide

on:
  release:
    types: [published]
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'doc/**'
      - '.github/workflows/user-guide.yaml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHON_VRSN: '3.13'
      JULES_PATH: jules
      ARTIFACT_PATH: artifact
      OUTPUT_PATH: jules_docs
      VENV_PATH: jules/doc/.venv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: ${{ env.JULES_PATH }}
          # Get all refs to build historic versions
          fetch-depth: 0

      - name: Setup uv with Python ${{ env.PYTHON_VRSN }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VRSN }}

      - name: Cache uv venv
        uses: actions/cache@v4
        with:
          path: ${{ env.VENV_PATH }}
          key: ${{ runner.os }}-uv-${{ env.PYTHON_VRSN }}-${{ hashFiles('doc/pyproject.toml', 'doc/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ env.PYTHON_VRSN }}-
            ${{ runner.os }}-uv-

      - name: Install dependencies
        working-directory: ${{ env.JULES_PATH }}/doc
        run: uv sync

      - name: Lint Sphinx docs
        working-directory: ${{ env.JULES_PATH }}/doc
        run: uv run sphinx-lint source

      - name: Download Artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get workflow id of last run to upload an artifact
          run_id=$(gh run list -R MetOffice/jules -b main -w user-guide.yaml --limit 1 --json databaseId | jq -r '.[0].databaseId')

          # Download tarred artifact
          gh run download -R MetOffice/jules $run_id -n github-pages

          # Create output directory and untar
          mkdir -p ${{ env.ARTIFACT_PATH }}
          tar -xf artifact.tar -C ${{ env.ARTIFACT_PATH }}


      - name: Build HTML docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source ${{ env.VENV_PATH }}/bin/activate
          ls ${{ env.ARTIFACT_PATH }}
          if [ -d ${{ env.ARTIFACT_PATH }} ]; then
            echo "Using Artifact"
            python3 ${{ env.JULES_PATH }}/.github/scripts/create_jules_version_docs.py -j ${{ env.JULES_PATH }} -a ${{ env.ARTIFACT_PATH }} -o ${{ env.OUTPUT_PATH }} -l INFO
          else
            echo "Not Using Artifact"
            python3 ${{ env.JULES_PATH }}/.github/scripts/create_jules_version_docs.py -j jules -o ${{ env.OUTPUT_PATH }} -l INFO
          fi

      - name: Minimize uv cache
        run: uv cache prune --ci

      # -- Deploy to GitHub Pages only on push to upstream main
      - name: Setup GitHub Pages
        if: ${{ github.repository == 'MetOffice/jules' && github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'merge_group') }}
        uses: actions/configure-pages@v5

      - name: Upload artifact to GitHub Pages
        if: ${{ github.repository == 'MetOffice/jules' && github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'merge_group') }}
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ${{ env.OUTPUT_PATH }}
          # Use maximum retention days to avoid rebuilding all versions if possible
          retention-days: 90

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ github.repository == 'MetOffice/jules' && github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'merge_group') }}
        uses: actions/deploy-pages@v4
