# Build and deploy Sphinx-based user guide documentation to GitHub Pages

name: User Guide

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'doc/**'
      - '.github/workflows/user-guide.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHON_VRSN: '3.13'
      JULES_PATH: $GITHUB_WORKSPACE/jules
      OUTPUT_PATH: $GITHUB_WORKSPACE/jules_docs


    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: $JULES_PATH
          # Get all refs to build historic versions
          fetch-depth: 0

      - name: Setup uv with Python ${{ env.PYTHON_VRSN }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VRSN }}

      - name: Cache uv venv
        uses: actions/cache@v4
        with:
          path: $JULES_PATH/doc/.venv
          key: ${{ runner.os }}-uv-${{ env.PYTHON_VRSN }}-${{ hashFiles('doc/pyproject.toml', 'doc/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ env.PYTHON_VRSN }}-
            ${{ runner.os }}-uv-

      - name: Install dependencies
        working-directory: $JULES_PATH/doc
        run: uv sync

      - name: Lint Sphinx docs
        working-directory: $JULES_PATH/doc
        run: uv run sphinx-lint source

      - name: Download Artifact
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: artifact

      - name: Build HTML docs
        run: |
          if [ -f zipped_artifact ]; then
            unzip artifact.zip
            echo "Using Artifact"
            python3 $JULES_PATH/.github/scripts/create_jules_version_docs.py -j $JULES_PATH -a artifact -o $OUTPUT_PATH -l DEBUG
          else
            echo "Not Using Artifact"
            python3 $JULES_PATH/.github/scripts/create_jules_version_docs.py -j $JULES_PATH -o $OUTPUT_PATH -l DEBUG
          fi

      - name: Minimize uv cache
        run: uv cache prune --ci

      # -- Deploy to GitHub Pages only on push to upstream main
      - name: Setup GitHub Pages
        if: ${{ github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'merge_group') }}
        uses: actions/configure-pages@v5

      - name: Upload artifact to GitHub Pages
        if: ${{ github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'merge_group') }}
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: $OUTPUT_PATH
          # Use maximum retention days to avoid rebuilding all versions if possible
          retention-days: 90

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'merge_group') }}
        uses: actions/deploy-pages@v4
