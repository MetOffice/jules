help=At very high wind speeds, the drag coefficient is not well-known,
    =though observations suggest a reduction below the maximum value.
    =This parameter specifies the value taken at wind speeds greater than
    =u_cdn_max.
sort-key=25c
type=real

[namelist:jules_sea_seaice=cdn_max_sea]
compulsory=true
description="Maximum neutral drag coefficient over the sea"
help=The maximum value that the 10-m neutral drag coefficient
    =is permitted to take. Drag coefficients are not well-known
    =at high wind speeds though evidence generally suggests that
    =the drag coefficient does not increase above about 33 ms-1,
    =so that it does not exceed about 0.0024, based on laboratory
    =measurements. The limit in open seas seems a little higher,
    =about 0.003, because the fetch is not so limited.
sort-key=25b
type=real

